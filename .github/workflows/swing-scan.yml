name: EGX swing scan

on:
  schedule:
    # Sun-Thu 13:00 UTC = 16:00 Cairo (summer) / 15:00 Cairo (winter), after the 14:30 close
    - cron: "0 13 * * 0-4"
  workflow_dispatch:
    inputs:
      capital:
        description: "Account size (EGP)"
        default: "100000"
      risk_pct:
        description: "% of capital risked per trade"
        default: "1"

permissions:
  contents: write

concurrency:
  group: swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # branch tip at start, not the (possibly stale) trigger commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the optional AI review needs this; if the install fails the review is skipped, not the scan.
      - name: Install dependencies
        continue-on-error: true
        run: pip install -r requirements.txt

      # A failing test is surfaced in the report but never blocks it.
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: python -m unittest -v

      # The scanner always writes a report (status OK / DEGRADED / FAILED) and exits 0 when it did.
      - name: Run scan
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # unset -> AI review skipped
          CAPITAL: ${{ inputs.capital || '100000' }}
          RISK_PCT: ${{ inputs.risk_pct || '1' }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          python -m egx_swing --capital "$CAPITAL" --risk-pct "$RISK_PCT" --out-dir reports > scan.md
          if [ "$TESTS" != "success" ]; then
            echo "> ⛔ Unit tests failed on this commit - treat this report with suspicion." >> "$GITHUB_STEP_SUMMARY"
          fi
          cat scan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet && exit 0
          git commit -m "Swing scan $(TZ=Africa/Cairo date +%Y-%m-%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
